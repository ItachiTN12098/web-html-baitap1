<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Player</title>

<style>
/* Cài đặt chung */
body{
    margin:0;
    font-family: 'Arial', sans-serif;
    background: #f4f4f4; /* nền sáng nhẹ */
    color: #333;
}

/* HEADER */
header{
    background: #673ab7; /* màu tím đẹp */
    padding: 20px;
    text-align: center;
    font-size: 36px;
    letter-spacing: 3px;
    color: white;
    font-weight: bold;
    border-bottom: 4px solid #512da8;
}

/* LAYOUT */
.container{
    display: flex;
    height: 90vh;
    padding: 20px;
    justify-content: space-between;
    align-items: flex-start;
}

/* MENU */
.menu{
    width: 25%;
    background: #e0e0e0;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
}

.menu h2{
    margin-bottom: 20px;
    color: #333;
    font-size: 24px;
    font-weight: bold;
}

/* MỖI BÀI HÁT */
.song{
    background: #2196f3;
    margin-bottom: 15px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #1976d2;
    transition: 0.3s;
}

.song:hover{
    background: #1e88e5;
    transform: scale(1.05);
}

.song a{
    color: white;
    text-decoration: none;
    display: block;
    font-size: 18px;
    font-weight: bold;
}

/* PLAYER */
.player{
    width: 70%;
    padding: 20px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
}

.player iframe{
    width: 100%;
    height: 450px;
    border-radius: 10px;
    border: 2px solid #ddd;
}

/* Nút quay lại */
.back-btn {
    display: inline-block;
    padding: 10px 20px;
    background-color: #f44336;
    color: white;
    text-decoration: none;
    font-weight: bold;
    border-radius: 6px;
    margin-top: 20px;
    transition: 0.3s;
}

.back-btn:hover {
    background-color: #d32f2f;
    text-decoration: none;
}
</style>
</head>

<body>

<header>
🎵 MUSIC PLAYER 🎵
</header>

<div class="container">

<!-- DANH SÁCH -->
<div class="menu">
<h2>🎶 Playlist</h2>

<div class="song">
<a href="https://www.youtube.com/embed/rf16jlrYl7o" target="music">
Sai Cách Yêu Vanxi Remix
</a>
</div>

<div class="song">
<a href="https://www.youtube.com/embed/tH5LI8bKV4w" target="music">
Arabian Cat Meow
</a>
</div>

<div class="song">
<a href="https://www.youtube.com/embed/EV-91JV4Fws" target="music">
Túy Âm
</a>
</div>

</div>

<!-- VIDEO -->
<div class="player">
<h2>▶ Now Playing</h2>
<iframe name="music"
frameborder="0"
allow="autoplay; encrypted-media"
allowfullscreen>
</iframe>
</div>

</div>

<!-- Nút quay lại trang "Giới Thiệu Bản Thân" -->
<a href="https://itachitn12098.github.io/HuynhMinhTien.html/" class="back-btn">
  Quay lại Giới thiệu bản thân
</a>

</body>
</html>
