<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Music Player</title>

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f2f2f2; /* trắng ngà */
    color:black;
}

/* HEADER */
header{
    background:#e6e6e6;
    padding:15px;
    text-align:center;
    font-size:32px;
    letter-spacing:2px;
    color:#555; /* bạc đậm */
    font-weight:bold;
    border-bottom:2px solid black;
}

/* LAYOUT */
.container{
    display:flex;
    height:90vh;
}

/* MENU */
.menu{
    width:25%;
    background:#d9d9d9;
    padding:15px;
    border-right:2px solid black;
}

.menu h2{
    margin-bottom:15px;
    color:black;
}

/* MỖI BÀI HÁT */
.song{
    background:#bfbfbf;
    margin-bottom:10px;
    padding:12px;
    border-radius:8px;
    border:2px solid black;
    transition:0.3s;
}

.song:hover{
    background:#a6a6a6;
}

/* LINK */
.song a{
    color:white; /* chữ trắng */
    text-decoration:none;
    display:block;
    font-weight:bold;
}

/* PLAYER */
.player{
    width:75%;
    padding:20px;
}

.player iframe{
    width:100%;
    height:450px;
    border-radius:10px;
    border:2px solid black;
}

</style>
</head>

<body>

<header>
🎵 MUSIC PLAYER 🎵
</header>

<div class="container">

<!-- DANH SÁCH -->
<div class="menu">

<h2>🎶 Playlist</h2>

<div class="song">
<a href="https://www.youtube.com/embed/q8hR0F2sJzQ?autoplay=1" target="music">
Hồng Nhan - Jack
</a>
</div>

<div class="song">
<a href="https://www.youtube.com/embed/KKc_RMln5UY?autoplay=1" target="music">
Bạc Phận - Jack & K-ICM
</a>
</div>

<div class="song">
<a href="https://www.youtube.com/embed/wg7ztz0YbU8?autoplay=1" target="music">
Sóng Gió - Jack & K-ICM
</a>
</div>

</div>

<!-- VIDEO -->
<div class="player">

<h2>▶ Now Playing</h2>

<iframe name="music"
frameborder="0"
allow="autoplay; encrypted-media"
allowfullscreen>
</iframe>

</div>

</div>

</body>
</html>
